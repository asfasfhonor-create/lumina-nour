name: Lumina Quality

on:
  push:
    branches:
      - feature/nour-mobile-ui
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py lumina
      - name: Import smoke test
        run: |
          python - <<'PY'
          import lumina.ai_service
          import lumina.worlds.english
          import lumina.worlds.science
          import lumina.worlds.math
          import lumina.worlds.ict
          import lumina.worlds.arabic
          import lumina.worlds.social
          import lumina.worlds.religion
          import lumina.worlds.ai_lab
          import lumina.review_center
          import lumina.parent_dashboard
          import lumina.persistence.session_store
          print("Import smoke test OK")
          PY
      - name: Validate module registry
        run: |
          python - <<'PY'
          from lumina.module_registry import get_module, get_school_subjects

          subjects = get_school_subjects()
          assert len(subjects) == 7
          assert get_module("ai") is not None
          assert len({module.id for module in subjects}) == len(subjects)
          print("Module registry OK")
          PY
      - name: Validate curriculum catalog
        run: |
          python - <<'PY'
          from lumina.curriculum.catalog import ENGLISH_T1, SOURCES, get_sources

          assert len(SOURCES) == 9
          assert len(get_sources("english")) == 1
          assert len(get_sources("science")) == 2
          assert len(get_sources("math")) == 2
          assert ENGLISH_T1.filename == "English_language_prep3_t1.pdf"
          assert [unit.title for unit in ENGLISH_T1.units][:3] == [
              "Personal Identity",
              "Communication with Family and Friends",
              "Artificial Intelligence",
          ]
          assert len({source.id for source in SOURCES}) == len(SOURCES)
          print("Curriculum catalog OK")
          PY

      - name: Validate English Unit 1 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.english_unit1 import UNIT1_LESSONS

          assert len(UNIT1_LESSONS) == 6
          assert [lesson.title for lesson in UNIT1_LESSONS] == [
              "Beyond My Looks",
              "Self-Discovery",
              "The Mirror Moment",
              "Story Time — The School Garden Project",
              "Let's Talk — Respecting Personal Identity",
              "This Is Me — Descriptive Paragraph",
          ]
          for lesson in UNIT1_LESSONS:
              assert lesson.checks
              check = lesson.checks[0]
              assert len(check.options) == 3
              assert check.correct_index in (0, 1, 2)
          print("English Unit 1 lesson contracts OK")
          PY

      - name: Validate mastery rules
        run: |
          python - <<'PY'
          from lumina.learning.progress import (
              LEARNING,
              MASTERED,
              NEEDS_REVIEW,
              NOT_STARTED,
              derive_mastery,
          )

          assert derive_mastery([]).state == NOT_STARTED

          wrong = [{"check_id": "a", "correct": False}]
          mistakes = [{"check_id": "a", "resolved": False}]
          assert derive_mastery(wrong, mistakes).state == NEEDS_REVIEW

          repeated = [
              {"check_id": "a", "evidence_id": "a", "correct": True},
              {"check_id": "a", "evidence_id": "a", "correct": True},
              {"check_id": "a", "evidence_id": "a", "correct": True},
          ]
          assert derive_mastery(repeated).state == LEARNING

          varied = [
              {"check_id": "a", "evidence_id": "a", "correct": True},
              {"check_id": "b", "evidence_id": "b", "correct": True},
              {"check_id": "a", "evidence_id": "a", "correct": True},
          ]
          assert derive_mastery(varied).state == MASTERED
          print("Mastery rules OK")
          PY

      - name: Validate English Unit 2 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.english_unit2 import UNIT2_LESSONS

          assert len(UNIT2_LESSONS) == 6
          assert [lesson.title for lesson in UNIT2_LESSONS] == [
              "Stay Connected",
              "Communication, Challenges and Solutions",
              "The Silent Dinner",
              "Story Time — Taking Initiative and Building a Team",
              "Let's Talk — Proper Communication Skills",
              "Staying Close — Opinion Paragraph",
          ]
          for lesson in UNIT2_LESSONS:
              assert lesson.checks
              assert lesson.source_pages
          print("English Unit 2 lesson contracts OK")
          PY

      - name: Validate English Unit 3 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.english_unit3 import UNIT3_LESSONS

          assert len(UNIT3_LESSONS) == 6
          assert UNIT3_LESSONS[0].title == "Artificial Intelligence"
          assert UNIT3_LESSONS[-1].title == "Smart Robots — Email About AI"
          for lesson in UNIT3_LESSONS:
              assert lesson.checks
              assert lesson.source_pages
          print("English Unit 3 lesson contracts OK")
          PY

      - name: Validate complete English curriculum mapping
        run: |
          python - <<'PY'
          from lumina.curriculum.english_curriculum import ENGLISH_UNIT_LESSONS, all_english_lessons
          from lumina.curriculum.english_reviews import REVIEW1, REVIEW2

          assert list(ENGLISH_UNIT_LESSONS) == [
              "Personal Identity",
              "Communication with Family and Friends",
              "Artificial Intelligence",
              "Screen Time",
              "Design Thinking",
              "Why Do We Like Stories?",
          ]
          assert len(all_english_lessons()) == 36
          assert all(len(lessons) == 6 for lessons in ENGLISH_UNIT_LESSONS.values())
          assert len(REVIEW1.checks) == 3
          assert len(REVIEW2.checks) == 3
          print("Complete English curriculum mapping OK")
          PY

      - name: Validate Science Unit 1 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.science_unit1 import SCIENCE_UNIT1_LESSONS

          assert len(SCIENCE_UNIT1_LESSONS) == 3
          assert [lesson.title for lesson in SCIENCE_UNIT1_LESSONS] == [
              "Motion in One Direction",
              "Graphic Representation of Motion in a Straight Line",
              "Physical Quantities: Scalars and Vectors",
          ]
          for lesson in SCIENCE_UNIT1_LESSONS:
              assert lesson.checks
              assert lesson.source_pages
          print("Science Unit 1 lesson contracts OK")
          PY

      - name: Validate Math Unit 1 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.math_unit1 import MATH_UNIT1_LESSONS

          assert len(MATH_UNIT1_LESSONS) == 4
          assert [lesson.title for lesson in MATH_UNIT1_LESSONS] == [
              "Cartesian Product",
              "Relations",
              "Functions (Mapping)",
              "Polynomial Functions",
          ]
          for lesson in MATH_UNIT1_LESSONS:
              assert lesson.checks
              assert lesson.source_pages
          print("Math Unit 1 lesson contracts OK")
          PY

      - name: Validate ICT Chapter 1 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.ict_chapter1 import ICT_CHAPTER1_LESSONS

          assert len(ICT_CHAPTER1_LESSONS) == 5
          assert ICT_CHAPTER1_LESSONS[0].title == "Data Types"
          assert ICT_CHAPTER1_LESSONS[-1].title == "Errors"
          for lesson in ICT_CHAPTER1_LESSONS:
              assert lesson.checks
              assert lesson.source_pages
          print("ICT Chapter 1 lesson contracts OK")
          PY

      - name: Validate Arabic Social Religion foundations
        run: |
          python - <<'PY'
          from lumina.curriculum.arabic_unit1 import ARABIC_U1_LESSONS
          from lumina.curriculum.social_unit1 import SOCIAL_U1_LESSONS
          from lumina.curriculum.religion_unit1 import RELIGION_U1_LESSONS

          assert len(ARABIC_U1_LESSONS) == 4
          assert ARABIC_U1_LESSONS[0].title == "آداب التعامل مع الوالدين"
          assert len(SOCIAL_U1_LESSONS) == 3
          assert SOCIAL_U1_LESSONS[0].title == "موقع ومظاهر سطح قارات العالم الجديد"
          assert len(RELIGION_U1_LESSONS) == 7
          assert RELIGION_U1_LESSONS[0].title == "من أسماء الله الحسنى: الغفور"
          for lesson in (
              ARABIC_U1_LESSONS[0],
              SOCIAL_U1_LESSONS[0],
              RELIGION_U1_LESSONS[0],
          ):
              assert lesson.checks
              assert lesson.source_pages
          print("Arabic, Social, Religion foundations OK")
          PY

      - name: Validate Science Unit 2 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.science_unit2 import SCIENCE_UNIT2_LESSONS

          assert len(SCIENCE_UNIT2_LESSONS) == 2
          assert [lesson.title for lesson in SCIENCE_UNIT2_LESSONS] == ["Mirrors", "Lenses"]
          assert all(lesson.checks for lesson in SCIENCE_UNIT2_LESSONS)
          print("Science Unit 2 lesson contracts OK")
          PY

      - name: Validate Math Unit 2 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.math_unit2 import MATH_UNIT2_LESSONS

          assert len(MATH_UNIT2_LESSONS) == 3
          assert [lesson.title for lesson in MATH_UNIT2_LESSONS] == [
              "Ratio",
              "Proportion",
              "Direct Variation and Inverse Variation",
          ]
          assert all(lesson.checks for lesson in MATH_UNIT2_LESSONS)
          print("Math Unit 2 lesson contracts OK")
          PY

      - name: Validate complete first-term Science mapping
        run: |
          python - <<'PY'
          from lumina.curriculum.science_unit1 import SCIENCE_UNIT1_LESSONS
          from lumina.curriculum.science_unit2 import SCIENCE_UNIT2_LESSONS
          from lumina.curriculum.science_unit3 import SCIENCE_UNIT3_LESSONS
          from lumina.curriculum.science_unit4 import SCIENCE_UNIT4_LESSONS

          groups = [
              SCIENCE_UNIT1_LESSONS,
              SCIENCE_UNIT2_LESSONS,
              SCIENCE_UNIT3_LESSONS,
              SCIENCE_UNIT4_LESSONS,
          ]
          assert [len(group) for group in groups] == [3, 2, 1, 2]
          assert all(lesson.checks for group in groups for lesson in group)
          print("Complete first-term Science mapping OK")
          PY

      - name: Validate complete first-term Math mapping
        run: |
          python - <<'PY'
          from lumina.curriculum.math_unit1 import MATH_UNIT1_LESSONS
          from lumina.curriculum.math_unit2 import MATH_UNIT2_LESSONS
          from lumina.curriculum.math_unit3 import MATH_UNIT3_LESSONS
          from lumina.curriculum.math_unit4 import MATH_UNIT4_LESSONS
          from lumina.curriculum.math_unit5 import MATH_UNIT5_LESSONS

          groups = [
              MATH_UNIT1_LESSONS,
              MATH_UNIT2_LESSONS,
              MATH_UNIT3_LESSONS,
              MATH_UNIT4_LESSONS,
              MATH_UNIT5_LESSONS,
          ]
          assert [len(group) for group in groups] == [4, 3, 2, 2, 4]
          assert all(lesson.checks for group in groups for lesson in group)
          print("Complete first-term Math mapping OK")
          PY

      - name: Validate Real English baseline
        run: |
          python - <<'PY'
          from lumina.learning.english_profile import BASELINE_ITEMS, score_baseline

          assert len(BASELINE_ITEMS) == 6
          perfect = {item["id"]: item["correct_index"] for item in BASELINE_ITEMS}
          result = score_baseline(perfect)
          assert result.correct == 6
          assert result.total == 6
          assert result.broad_band == "Independent-start"
          print("Real English baseline OK")
          PY

      - name: Validate all-subject mapped curriculum registry
        run: |
          python - <<'PY'
          from lumina.curriculum.mapped_curriculum import (
              MAPPED_CURRICULUM,
              all_mapped_lessons,
              curriculum_counts,
          )

          counts = curriculum_counts()
          assert set(MAPPED_CURRICULUM) == {
              "english", "science", "math", "arabic", "social", "religion", "ict"
          }
          assert counts["english"] == 38
          assert counts["science"] == 14
          assert counts["math"] == 35
          assert counts["arabic"] == 12
          assert counts["social"] == 11
          assert counts["religion"] == 21
          assert counts["ict"] == 13
          assert len(all_mapped_lessons()) == 144
          assert all(lesson.checks for lesson in all_mapped_lessons())
          print("All-subject mapped curriculum registry OK:", counts)
          PY

      - name: Validate complete ICT mapping
        run: |
          python - <<'PY'
          from lumina.curriculum.ict_chapter1 import ICT_CHAPTER1_LESSONS
          from lumina.curriculum.ict_chapter2 import ICT_CHAPTER2_LESSONS
          from lumina.curriculum.ict_chapter3 import ICT_CHAPTER3_LESSONS
          from lumina.curriculum.ict_chapter4 import ICT_CHAPTER4_LESSONS
          assert [len(x) for x in (
              ICT_CHAPTER1_LESSONS,
              ICT_CHAPTER2_LESSONS,
              ICT_CHAPTER3_LESSONS,
              ICT_CHAPTER4_LESSONS,
          )] == [5,3,4,1]
          print("Complete ICT mapping OK")
          PY

      - name: Validate complete Arabic Social Religion mapping
        run: |
          python - <<'PY'
          from lumina.curriculum.arabic_unit1 import ARABIC_U1_LESSONS
          from lumina.curriculum.arabic_unit2 import ARABIC_U2_LESSONS
          from lumina.curriculum.arabic_unit3 import ARABIC_U3_LESSONS
          from lumina.curriculum.social_unit1 import SOCIAL_U1_LESSONS
          from lumina.curriculum.social_unit2 import SOCIAL_U2_LESSONS
          from lumina.curriculum.social_unit3 import SOCIAL_U3_LESSONS
          from lumina.curriculum.social_unit4 import SOCIAL_U4_LESSONS
          from lumina.curriculum.religion_unit1 import RELIGION_U1_LESSONS
          from lumina.curriculum.religion_unit2 import RELIGION_U2_LESSONS
          from lumina.curriculum.religion_unit3 import RELIGION_U3_LESSONS

          assert [len(x) for x in (ARABIC_U1_LESSONS, ARABIC_U2_LESSONS, ARABIC_U3_LESSONS)] == [4,4,4]
          assert [len(x) for x in (SOCIAL_U1_LESSONS, SOCIAL_U2_LESSONS, SOCIAL_U3_LESSONS, SOCIAL_U4_LESSONS)] == [3,3,3,2]
          assert [len(x) for x in (RELIGION_U1_LESSONS, RELIGION_U2_LESSONS, RELIGION_U3_LESSONS)] == [7,7,7]
          print("Arabic, Social, Religion mappings OK")
          PY

      - name: Validate complete second-term Math Science mapping
        run: |
          python - <<'PY'
          from lumina.curriculum.science_t2_unit1 import SCIENCE_T2_UNIT1_LESSONS
          from lumina.curriculum.science_t2_unit2 import SCIENCE_T2_UNIT2_LESSONS
          from lumina.curriculum.science_t2_unit3 import SCIENCE_T2_UNIT3_LESSONS
          from lumina.curriculum.math_t2_unit1 import MATH_T2_UNIT1_LESSONS
          from lumina.curriculum.math_t2_unit2 import MATH_T2_UNIT2_LESSONS
          from lumina.curriculum.math_t2_unit3 import MATH_T2_UNIT3_LESSONS
          from lumina.curriculum.math_t2_unit4 import MATH_T2_UNIT4_LESSONS
          from lumina.curriculum.math_t2_unit5 import MATH_T2_UNIT5_LESSONS

          assert [len(x) for x in (
              SCIENCE_T2_UNIT1_LESSONS,
              SCIENCE_T2_UNIT2_LESSONS,
              SCIENCE_T2_UNIT3_LESSONS,
          )] == [2,3,1]
          assert [len(x) for x in (
              MATH_T2_UNIT1_LESSONS,
              MATH_T2_UNIT2_LESSONS,
              MATH_T2_UNIT3_LESSONS,
              MATH_T2_UNIT4_LESSONS,
              MATH_T2_UNIT5_LESSONS,
          )] == [3,4,2,4,7]
          print("Second-term Math and Science mappings OK")
          PY

      - name: Validate learning timestamps and mission imports
        run: |
          python - <<'PY'
          from lumina.curriculum.mapped_curriculum import all_mapped_lessons, curriculum_counts
          from lumina.learning.missions import get_lesson_by_id, get_module_for_lesson_id
          from lumina.learning.rewards import XP_PER_NEW_SUCCESS
          import lumina.daily_mission
          import lumina.exam_mode

          lessons = all_mapped_lessons()
          assert len(lessons) == 144
          first = lessons[0]
          assert get_lesson_by_id(first.id) is first
          assert get_module_for_lesson_id(first.id) in {
              "english", "science", "math", "arabic", "social", "religion", "ict"
          }
          assert XP_PER_NEW_SUCCESS > 0
          assert sum(curriculum_counts().values()) == 144
          print("Mission/reward/import contracts OK")
          PY

      - name: Validate every mapped lesson contract
        run: |
          python - <<'PY'
          from lumina.curriculum.mapped_curriculum import all_mapped_lessons

          lesson_ids = set()
          check_ids = set()
          for lesson in all_mapped_lessons():
              assert lesson.id not in lesson_ids, lesson.id
              lesson_ids.add(lesson.id)
              assert lesson.source_id
              assert lesson.unit_id
              assert lesson.title
              assert lesson.source_pages
              assert lesson.objectives
              assert lesson.key_terms
              assert lesson.evidence_summary
              assert lesson.checks

              for check in lesson.checks:
                  compound = (lesson.id, check.id)
                  assert compound not in check_ids, compound
                  check_ids.add(compound)
                  assert check.prompt
                  assert check.hint
                  assert len(check.options) >= 2
                  assert check.correct_index is not None
                  assert 0 <= check.correct_index < len(check.options)

          print(f"Validated {len(lesson_ids)} lessons and {len(check_ids)} checks")
          PY

      - name: Validate adaptive weekly plan imports
        run: |
          python - <<'PY'
          from lumina.learning.weekly_plan import WeeklyPlanItem, build_weekly_plan
          import lumina.weekly_plan

          assert WeeklyPlanItem.__name__ == "WeeklyPlanItem"
          assert callable(build_weekly_plan)
          print("Weekly plan contracts OK")
          PY

      - name: Validate future skill registration
        run: |
          python - <<'PY'
          from lumina.module_registry import LearningModule, get_module, register_module

          future = LearningModule(
              id="research_skills_test",
              title="Research Skills",
              description="Test-only future skill module.",
              category="life_skill",
              icon="🔎",
              track="enrichment",
              mastery_dimensions=("questioning", "sources", "verification"),
              stages=("starter", "builder"),
              activity_types=("mission", "project"),
          )
          register_module(future)
          assert get_module("research_skills_test") == future
          print("Future skill registration OK")
          PY

      - name: Validate app access gate import
        run: |
          python - <<'PY'
          import lumina.access_control
          assert callable(lumina.access_control.require_app_access)
          print("App access gate import OK")
          PY

      - name: Validate durable persistence adapter imports
        run: |
          python - <<'PY'
          from lumina.persistence.neon_store import NeonLearningStore
          from lumina.persistence.session_store import get_learning_store
          assert NeonLearningStore.__name__ == "NeonLearningStore"
          assert callable(get_learning_store)
          print("Neon persistence adapter imports OK")
          PY

      - name: Validate curriculum search
        run: |
          python - <<'PY'
          from lumina.curriculum.search import lesson_by_id, search_curriculum

          ohm = search_curriculum("Ohm law")
          assert ohm
          assert any("Electric" in hit.title or "Properties" in hit.title for hit in ohm)

          arabic = search_curriculum("اسم المفعول")
          assert arabic
          assert any("الصداقة" in hit.title for hit in arabic)

          lesson = lesson_by_id(arabic[0].lesson_id)
          assert lesson is not None
          assert lesson.source_pages
          print("Curriculum search OK")
          PY

      - name: Validate Neon schema contract
        run: |
          python - <<'PY'
          from pathlib import Path

          sql = Path("neon/lumina_schema.sql").read_text(encoding="utf-8")
          for table in (
              "lumina_learning_attempts",
              "lumina_mistakes",
              "lumina_reviews",
              "lumina_profile_state",
          ):
              assert f"create table if not exists {table}" in sql.lower()
          assert "unique (learner_key, lesson_id, check_id)" in sql.lower()
          print("Neon schema contract OK")
          PY

      - name: Validate Neon persistence contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          from lumina.persistence.neon_store import NeonLearningStore
          from lumina.persistence.session_store import get_learning_store
          from lumina.persistence.backup import export_learning_backup, restore_learning_backup

          schema = Path("neon/lumina_schema.sql").read_text(encoding="utf-8")
          for table in (
              "lumina_learning_attempts",
              "lumina_mistakes",
              "lumina_reviews",
              "lumina_profile_state",
          ):
              assert table in schema

          assert NeonLearningStore.__name__ == "NeonLearningStore"
          assert callable(get_learning_store)
          assert callable(export_learning_backup)
          assert callable(restore_learning_backup)
          print("Neon persistence contracts OK")
          PY

      - name: Validate production secrets template
        run: |
          python - <<'PY'
          from pathlib import Path

          template = Path(".streamlit/secrets.example.toml").read_text(encoding="utf-8")
          assert "NEON_DATABASE_URL" in template
          assert "NOUR_LEARNER_KEY" in template
          assert "SUPABASE_SECRET_KEY = " not in template
          assert "PASSWORD@HOST" in template
          print("Production secrets template OK")
          PY
