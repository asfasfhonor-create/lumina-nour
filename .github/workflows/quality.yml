      - name: Validate bounded persistence query counts
        run: |
          python - <<'PY'
          from lumina.learning.missions import choose_mission
          from lumina.learning.weekly_plan import build_weekly_plan

          class CountingStore:
              def __init__(self):
                  self.calls = {"attempts": 0, "mistakes": 0, "reviews": 0}

              def get_attempts(self, lesson_id=None):
                  self.calls["attempts"] += 1
                  assert lesson_id is None, "planner must bulk-fetch attempts"
                  return []

              def get_mistakes(self, lesson_id=None, unresolved_only=False):
                  self.calls["mistakes"] += 1
