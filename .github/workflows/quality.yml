      - name: Validate persistence outage fallback imports
        run: |
          python - <<'PY'
          from lumina.persistence.base import PersistenceError
          from lumina.persistence.neon_store import NeonLearningStore
          from lumina.persistence.profile_state import hydrate_profile_state, persist_profile_state

          store = NeonLearningStore(
              "postgresql://user:password@example.invalid/db?sslmode=require",
