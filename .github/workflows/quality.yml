      - name: Validate every mapped lesson contract
        run: |
          python - <<'PY'
          from lumina.curriculum.mapped_curriculum import all_mapped_lessons

          lesson_ids = set()
          check_ids = set()
          for lesson in all_mapped_lessons():
              assert lesson.id not in lesson_ids, lesson.id
              lesson_ids.add(lesson.id)
              assert lesson.source_id
              assert lesson.unit_id
              assert lesson.title
              assert lesson.source_pages
              assert lesson.objectives
              assert lesson.key_terms
              assert lesson.evidence_summary
              assert lesson.checks

              for check in lesson.checks:
                  compound = (lesson.id, check.id)
                  assert compound not in check_ids, compound
                  check_ids.add(compound)
                  assert check.prompt
                  assert check.hint
                  assert len(check.options) >= 2
                  assert check.correct_index is not None
                  assert 0 <= check.correct_index < len(check.options)

          print(f"Validated {len(lesson_ids)} lessons and {len(check_ids)} checks")
          PY

