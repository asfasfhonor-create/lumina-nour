name: Lumina Quality

on:
  push:
    branches:
      - feature/nour-mobile-ui
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q app.py lumina
      - name: Validate module registry
        run: |
          python - <<'PY'
          from lumina.module_registry import get_module, get_school_subjects

          subjects = get_school_subjects()
          assert len(subjects) == 7
          assert get_module("ai") is not None
          assert len({module.id for module in subjects}) == len(subjects)
          print("Module registry OK")
          PY
      - name: Validate curriculum catalog
        run: |
          python - <<'PY'
          from lumina.curriculum.catalog import ENGLISH_T1, SOURCES, get_sources

          assert len(SOURCES) == 7
          assert len(get_sources("english")) == 1
          assert ENGLISH_T1.filename == "English_language_prep3_t1.pdf"
          assert [unit.title for unit in ENGLISH_T1.units][:3] == [
              "Personal Identity",
              "Communication with Family and Friends",
              "Artificial Intelligence",
          ]
          assert len({source.id for source in SOURCES}) == len(SOURCES)
          print("Curriculum catalog OK")
          PY

      - name: Validate English Unit 1 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.english_unit1 import UNIT1_LESSONS

          assert len(UNIT1_LESSONS) == 6
          assert [lesson.title for lesson in UNIT1_LESSONS] == [
              "Beyond My Looks",
              "Self-Discovery",
              "The Mirror Moment",
              "Story Time — The School Garden Project",
              "Let's Talk — Respecting Personal Identity",
              "This Is Me — Descriptive Paragraph",
          ]
          for lesson in UNIT1_LESSONS:
              assert lesson.checks
              check = lesson.checks[0]
              assert len(check.options) == 3
              assert check.correct_index in (0, 1, 2)
          print("English Unit 1 lesson contracts OK")
          PY

      - name: Validate mastery rules
        run: |
          python - <<'PY'
          from lumina.learning.progress import (
              LEARNING,
              MASTERED,
              NEEDS_REVIEW,
              NOT_STARTED,
              derive_mastery,
          )

          assert derive_mastery([]).state == NOT_STARTED

          wrong = [{"check_id": "a", "correct": False}]
          mistakes = [{"check_id": "a", "resolved": False}]
          assert derive_mastery(wrong, mistakes).state == NEEDS_REVIEW

          repeated = [
              {"check_id": "a", "evidence_id": "a", "correct": True},
              {"check_id": "a", "evidence_id": "a", "correct": True},
              {"check_id": "a", "evidence_id": "a", "correct": True},
          ]
          assert derive_mastery(repeated).state == LEARNING

          varied = [
              {"check_id": "a", "evidence_id": "a", "correct": True},
              {"check_id": "b", "evidence_id": "b", "correct": True},
              {"check_id": "a", "evidence_id": "a", "correct": True},
          ]
          assert derive_mastery(varied).state == MASTERED
          print("Mastery rules OK")
          PY

      - name: Validate English Unit 2 curriculum lessons
        run: |
          python - <<'PY'
          from lumina.curriculum.english_unit2 import UNIT2_LESSONS

          assert len(UNIT2_LESSONS) == 6
          assert [lesson.title for lesson in UNIT2_LESSONS] == [
              "Stay Connected",
              "Communication, Challenges and Solutions",
              "The Silent Dinner",
              "Story Time — Taking Initiative and Building a Team",
              "Let's Talk — Proper Communication Skills",
              "Staying Close — Opinion Paragraph",
          ]
          for lesson in UNIT2_LESSONS:
              assert lesson.checks
              assert lesson.source_pages
          print("English Unit 2 lesson contracts OK")
          PY
