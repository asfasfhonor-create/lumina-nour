          import lumina.daily_mission
          import lumina.exam_mode

          lessons = all_mapped_lessons()
          assert len(lessons) == 144
          first = lessons[0]
          assert get_lesson_by_id(first.id) is first
          assert get_module_for_lesson_id(first.id) in {
              "english", "science", "math", "arabic", "social", "religion", "ict"
