              MATH_T2_UNIT1_LESSONS,
              MATH_T2_UNIT2_LESSONS,
              MATH_T2_UNIT3_LESSONS,
              MATH_T2_UNIT4_LESSONS,
              MATH_T2_UNIT5_LESSONS,
          )] == [3,4,2,4,7]
