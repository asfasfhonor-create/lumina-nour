      - name: Validate automatic planning stays in Term 1
        run: |
          python - <<'PY'
          from lumina.learning.missions import choose_mission
          from lumina.learning.weekly_plan import build_weekly_plan
          from lumina.curriculum.mapped_curriculum import MAPPED_CURRICULUM

          class EmptyStore:
              def get_reviews(self, status=None): return []
              def get_attempts(self, lesson_id=None): return []
              def get_mistakes(self, lesson_id=None, unresolved_only=False): return []

          store = EmptyStore()
          mission = choose_mission(store)
          assert mission is not None
          unit_name = next(
              name for name, lessons in MAPPED_CURRICULUM[mission.module_id].items()
              if any(lesson.id == mission.lesson_id for lesson in lessons)
          )
          assert unit_name.startswith("Term 1"), unit_name
          assert mission.module_id != "ict"

          plan = build_weekly_plan(store, limit=5)
          assert plan
          for item in plan:
              assert item.module_id != "ict"
              unit_name = next(
                  name for name, lessons in MAPPED_CURRICULUM[item.module_id].items()
                  if any(lesson.id == item.lesson_id for lesson in lessons)
              )
              assert unit_name.startswith("Term 1"), (item.module_id, unit_name)
          print("Automatic planning Term 1 only OK")
          PY

