          PY

      - name: Validate Real English baseline
        run: |
          python - <<'PY'
          from lumina.learning.english_profile import BASELINE_ITEMS, score_baseline

          assert len(BASELINE_ITEMS) == 6
          perfect = {item["id"]: item["correct_index"] for item in BASELINE_ITEMS}
          result = score_baseline(perfect)
          assert result.correct == 6
          assert result.total == 6
          assert result.broad_band == "Independent-start"
          print("Real English baseline OK")
          PY

      - name: Validate all-subject mapped curriculum registry
        run: |
          python - <<'PY'
          from lumina.curriculum.mapped_curriculum import (
              MAPPED_CURRICULUM,
              all_mapped_lessons,
              curriculum_counts,
          )

          counts = curriculum_counts()
          assert set(MAPPED_CURRICULUM) == {
              "english", "science", "math", "arabic", "social", "religion", "ict"
          }
          assert counts["english"] == 38
          assert counts["science"] == 14
          assert counts["math"] == 35
          assert counts["arabic"] == 12
          assert counts["social"] == 11
          assert counts["religion"] == 21
          assert counts["ict"] == 13
          assert len(all_mapped_lessons()) == 144
          assert all(lesson.checks for lesson in all_mapped_lessons())
          print("All-subject mapped curriculum registry OK:", counts)
          PY

